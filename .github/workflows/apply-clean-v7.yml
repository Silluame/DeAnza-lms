name: Apply cleaner V7 build

on:
  push:
    paths:
      - '.github/workflows/apply-clean-v7.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace site files with cleaner V7
        shell: bash
        run: |
          cat > /tmp/clean-v7.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 -d /tmp/clean-v7.b64 > /tmp/clean-v7.tar.gz
          tar -xzf /tmp/clean-v7.tar.gz -C .
          rm -f .github/workflows/apply-clean-v7.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace site with cleaner V7 build"
          git push
