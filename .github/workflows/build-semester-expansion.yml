name: Build semester expansion

on:
  push:
    paths:
      - '.github/workflows/build-semester-expansion.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode full-semester files
        shell: bash
        run: |
          cat .semester/semjs.part.* | base64 -d | gunzip > semester_expansion.js
          cat .semester/semcss.b64 | base64 -d | gunzip > semester_expansion.css
          node --check semester_expansion.js
          rm -rf .semester
          rm -f .github/workflows/build-semester-expansion.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add full Fall 2026 semester expansion"
          git push
